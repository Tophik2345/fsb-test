<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ФСБ · Экзамен УК и УПК</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #05060c; --panel: #12131ae6; --row: #2a2c3e; --row-hover: #32344a;
      --row-on: #32304a; --text: #ececf3; --muted: #9a9bb0; --violet: #7b6cff;
      --pass: #3dd68c; --fail: #ff6b7a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; background: #05060c; color: var(--text); font-family: Inter, sans-serif; }
    body { display: flex; justify-content: center; position: relative; overflow-x: hidden; }
    .fx { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; background: #05060c; }
    .fx .photo {
      position: absolute; inset: -8%;
      background: url("bg.jpg") center / cover no-repeat;
      animation: ken 28s ease-in-out infinite alternate;
      filter: saturate(1.05);
    }
    .fx .dim {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(5,6,12,.55) 0%, rgba(5,6,12,.72) 45%, rgba(5,6,12,.88) 100%);
    }
    .fx .rain {
      position: absolute; inset: -40% 0;
      background:
        repeating-linear-gradient(188deg, transparent 0 10px, rgba(220,235,255,.18) 10px 11px, transparent 11px 22px),
        repeating-linear-gradient(172deg, transparent 0 16px, rgba(180,200,230,.10) 16px 17px, transparent 17px 34px);
      animation: rain .9s linear infinite;
      opacity: .85;
      mix-blend-mode: screen;
    }
    @keyframes ken {
      from { transform: scale(1.08) translate(-2%, 1%); }
      to { transform: scale(1.22) translate(2.5%, -2%); }
    }
    @keyframes rain { from { transform: translateY(-12%); } to { transform: translateY(12%); } }
    .app { width: 100%; max-width: 760px; min-height: 100vh; position: relative; z-index: 1; }
    .top-pad { height: 56px; }
    .panel { margin: 0 10px 24px; background: var(--panel); border-radius: 18px; padding: 18px 14px 22px; backdrop-filter: blur(10px); }
    .q { margin-bottom: 22px; }
    .q:last-child { margin-bottom: 0; }
    .q-title { font-size: 14.5px; line-height: 1.45; font-weight: 600; margin: 0 4px 10px; }
    .opts { display: flex; flex-direction: column; gap: 8px; }
    .opt {
      display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 10px 14px;
      background: var(--row); border: none; border-radius: 999px; color: var(--text);
      font: 500 14.5px/1.3 Inter, sans-serif; text-align: left; cursor: pointer; width: 100%;
    }
    .opt:hover { background: var(--row-hover); }
    .opt.on { background: var(--row-on); }
    .radio { width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; background: #6d6f82; box-shadow: inset 0 0 0 5px #6d6f82; }
    .opt.on .radio { background: #fff; box-shadow: inset 0 0 0 5px var(--violet); }
    .bar { position: sticky; bottom: 0; padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); background: linear-gradient(to top, #05060c 70%, transparent); }
    .submit { width: 100%; height: 50px; border: none; border-radius: 14px; background: var(--violet); color: #fff; font: 650 16px Inter, sans-serif; cursor: pointer; }
    .submit:disabled { background: #3a3b52; color: #8a8aa0; cursor: not-allowed; }
    .miss {
      color: var(--fail); font-size: 13px; text-align: center; margin: 0 0 8px;
      line-height: 1.45; display: none;
    }
    .miss.show { display: block; }
    .miss b { cursor: pointer; text-decoration: underline; }
    .screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 22px; text-align: center; }
    .badge { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--violet); font-weight: 700; margin-bottom: 14px; }
    .screen h1 { font-size: 28px; font-weight: 700; margin-bottom: 10px; }
    .screen p { color: var(--muted); font-size: 15px; line-height: 1.5; max-width: 320px; }
    .score { font-size: 56px; font-weight: 700; margin: 22px 0 8px; }
    .score.pass { color: var(--pass); }
    .score.fail { color: var(--fail); }
    .status { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .ghost { margin: 20px 0 28px; background: var(--row); color: var(--text); border: none; border-radius: 14px; height: 48px; padding: 0 22px; font: 600 15px Inter, sans-serif; cursor: pointer; width: min(320px, 100%); }
    .nick { width: 100%; max-width: 320px; height: 48px; margin: 8px 0; border: none; border-radius: 14px; background: var(--row); color: var(--text); padding: 0 16px; font: 500 15px Inter, sans-serif; outline: none; }
    select.nick { appearance: none; cursor: pointer; }
    .progress { color: var(--muted); font-size: 12px; text-align: right; padding: 0 16px 8px; }
    .hint { font-size: 12px; color: #6e6f84; margin-top: 10px; }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.62); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 20; }
    .plaque { width: min(340px, 100%); background: #161722; border-radius: 22px; padding: 28px 22px 22px; text-align: center; }
    .who { font-size: 20px; font-weight: 700; margin: 4px 0 10px; }
    .meta { color: var(--muted); font-size: 14px; line-height: 1.55; }
  </style>
</head>
<body>

  <div class="app" id="app"></div>
  <script>

    const UK_QS = [
      { tag: "УК", text: "Нужной статьи в УК нет. Можно закрыть «ближайшей по смыслу»?", options: ["Да, если вред явный", "Да, по уставу", "Нет. Нет статьи — нет состава", "Да, с разрешения старшего"], correct: 2 },
      { tag: "УК", text: "Командир сказал «сажай по 17.6», в УК состава нет. Чем закрывать?", options: ["Приказом", "Уставом", "Ничем. Приказ состав не создаёт", "17.6 «за непослушание приказу»"], correct: 2 },
      { tag: "УК", text: "Человек совершил преступление пьяным. Опьянение снимает уголовную ответственность?", options: ["Да", "Только если пиво", "Нет. Пьяный отвечает как трезвый", "Да, если не помнит, что сделал"], correct: 2 },
      { tag: "УК", text: "Толкнул плечом, синяков нет, статья «по побоям» на бумаге есть. Закрывать статьёй?", options: ["Да, раз признаки есть", "Нет. Нет вреда — преступления нет", "Да, 17.6", "Держать час на всякий"], correct: 1 },
      { tag: "УК", text: "Доказали только 17.6. Ставить ещё 17.3 «чтобы запомнил»?", options: ["Можно", "Можно по указанию старшего", "Нельзя. Только то, что доказали", "Можно, если камера пишет"], correct: 2 },

      { tag: "УК", text: "Госслужащего задержали по статье со штрафом. Кто ставит уголовный штраф?", options: ["Ты, раз задержал", "Старший смены", "Только прокурор", "Руководитель его органа"], correct: 2 },
      { tag: "УК", text: "По статье срок вправе дать только суд. Сотрудник ФСБ сам, без суда, посадил человека по этой статье. Какую статью он нарушил?", options: ["Никакую. Он ФСБ", "17.6 на задержанного", "15.2 — заведомо незаконное применение государственного принуждения", "17.3"], correct: 2 },
      { tag: "УК", text: "Правило ст. 33 УК: вне суда за один выход максимум 5 лет. Исключение одно. Какое?", options: ["Любая тяжкая статья", "Любая статья с пометкой (С)", "Статья 17.3, если оскорбление сотрудника произошло уже во время этого процесса", "Сотрудник ФСБ всегда может дать больше 5 лет"], correct: 2 },

      { tag: "УК", text: "Человек не ударил и не угрожал. Только матом оскорбил сотрудника при исполнении, чтобы унизить. Какая статья?", options: ["17.2 — насилие", "17.6 — неисполнение требования", "17.3 — оскорбление сотрудника", "17.1 — посягательство на жизнь"], correct: 2 },

      { tag: "УПК", text: "Наручники надел только довести до участка и сразу снял. Это новый час?", options: ["Да", "Час обнуляется", "Нет", "Да, если не снимал 10 секунд"], correct: 2 },
      { tag: "УПК", text: "Отдал задержанного коллеге / в СК. Час:", options: ["С нуля у них", "Общий", "Пауза, пока везут", "Плюс час"], correct: 1 },
      { tag: "УПК", text: "Для задержания в УПК достаточно ОДНОГО основания. Есть видео, где это лицо совершает деяние. Свидетелей нет. Задержание законно?", options: ["Нет. Без трёх свидетелей нельзя", "Нет. Нужен письменный акт", "Да. Видео — отдельное основание, свидетели не обязательны", "Да, только если есть ещё ориентировка"], correct: 2 },

      { tag: "УПК", text: "Чужое дело СК. Нельзя:", options: ["Пресечь и сохранить следы", "Передать человека, видео, изъятое", "Самим окончательно закрыть материал", "Вызвать уполномоченного"], correct: 2 },

      { tag: "УПК", text: "Задержали госслужащего. Кто решает по существу?", options: ["Ты", "Его руководитель", "Прокурор (следователь — в пределах своих прав)", "Дежурный ИВС"], correct: 2 },
      { tag: "УПК", text: "Позвонил в его ведомство «держим вашего». Это:", options: ["Стоп часа", "Право начальника закрыть дело", "Только информация, час не стоит", "Обязательный вызов прокурора вместо вызова"], correct: 2 },
      { tag: "УПК", text: "Прокуратура вызов подтвердила. Час:", options: ["Идёт дальше", "Стоит до 15 минут, пока едет прокурор", "Стоит без лимита", "Обнуляется"], correct: 1 },

          b.type = "button";
          b.className = "opt" + (answers[qi] === oi ? " on" : "");
          b.innerHTML = `<span class="radio"></span><span>${label}</span>`;
          b.onclick = () => { answers[qi] = oi; renderQuiz(); };
          opts.appendChild(b);
        });
        wrap.appendChild(opts);
        list.appendChild(wrap);
      });

      const missEl = document.getElementById("miss");
      const skipped = answers.map((a, i) => a === null ? i + 1 : null).filter(Boolean);
      if (skipped.length && missEl) {
        missEl.classList.add("show");
        missEl.innerHTML = "Не отвечены: " + skipped.map((n) => "<b data-n=\"" + n + "\">" + n + "</b>").join(", ");
        missEl.onclick = (e) => {
          const n = e.target && e.target.dataset && e.target.dataset.n;
          if (!n) return;
          const el = document.getElementById("q-" + n);
          if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
        };
      }
      const nearBottom = () => {
        const doc = document.documentElement;
        return window.innerHeight + window.scrollY >= doc.scrollHeight - 80;
      };
      const pingMiss = () => {
        if (!missEl || !skipped.length || !nearBottom()) return;
        missEl.classList.add("show");
      };
      window.addEventListener("scroll", pingMiss, { passive: true });
      pingMiss();
    }

    async function sendDiscord(score, ok) {
      const url = WEBHOOK.trim();
      if (!url) return "no-hook";
      const r = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: "ФСБ · Тест 2–3",
          content: "<@" + disc + ">",
          allowed_mentions: { users: [disc] },
          embeds: [{
            title: (ok ? "Сдал" : "Не сдал") + ' "' + exam + '"',
            color: ok ? 0x3dd68c : 0xff6b7a,
            fields: [
              { name: "Имя Фамилия", value: nick, inline: true },
              { name: "Статик", value: staticId, inline: true },
              { name: "Ранг", value: rank, inline: true },
              { name: "ID Discord", value: "<@" + disc + ">", inline: true },
              { name: "Баллы", value: score + "/" + QUESTIONS.length, inline: true }
            ],
            footer: { text: "ФСБ · 2–3 · " + exam },
            timestamp: new Date().toISOString()
          }]
        })
      });
      if (!r.ok) throw new Error("discord " + r.status);
      return "ok";
    }

    async function showResult() {
      let score = 0;
      QUESTIONS.forEach((q, i) => { if (answers[i] === q.correct) score++; });
      const ok = score >= PASS;
      const box = document.createElement("div");
      box.className = "overlay";
      box.innerHTML = `
        <div class="plaque">
          <div class="badge">${ok ? "Сдали" : "Не сдали"} · ${exam}</div>
          <div class="who">${nick}</div>
          <div class="meta">Статик: ${staticId}</div>
          <div class="meta">Ранг: ${rank}</div>
          <div class="meta">Discord: ${disc}</div>
          <div class="score ${ok ? "pass" : "fail"}">${score}/${QUESTIONS.length}</div>
          <p class="hint" id="hook"></p>
          <button class="ghost" id="again" style="margin:16px 0 0;width:100%">Закрыть</button>
        </div>`;
      document.body.appendChild(box);
      try {
        const st = await sendDiscord(score, ok);
        document.getElementById("hook").textContent = st === "no-hook" ? "Webhook не прописан." : "Отправлено в Discord.";
      } catch (e) {
        document.getElementById("hook").textContent = "В Discord не ушло.";
      }
      document.getElementById("again").onclick = () => { box.remove(); answers.fill(null); startScreen(); };
    }

    startScreen();
  </script>
</body>
</html>
