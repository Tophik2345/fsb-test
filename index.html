<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ФСБ · Тест 2–3 ранг</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #05060c; --panel: #12131ae6; --row: #2a2c3e; --row-hover: #32344a;
      --row-on: #32304a; --text: #ececf3; --muted: #9a9bb0; --violet: #7b6cff;
      --pass: #3dd68c; --fail: #ff6b7a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; background: #05060c; color: var(--text); font-family: Inter, sans-serif; }
    body { display: flex; justify-content: center; position: relative; overflow-x: hidden; }
    .fx { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; background: #05060c; }
    .fx .photo {
      position: absolute; inset: -8%;
      background: url("bg.jpg") center / cover no-repeat;
      animation: ken 28s ease-in-out infinite alternate;
      filter: saturate(1.05);
    }
    .fx .dim {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(5,6,12,.55) 0%, rgba(5,6,12,.72) 45%, rgba(5,6,12,.88) 100%);
    }
    @keyframes ken {
      from { transform: scale(1.05) translate(-1.5%, 0); }
      to { transform: scale(1.14) translate(1.5%, -1%); }
    }
    .app { width: 100%; max-width: 760px; min-height: 100vh; position: relative; z-index: 1; }
    .top-pad { height: 56px; }
    .panel { margin: 0 10px 24px; background: var(--panel); border-radius: 18px; padding: 18px 14px 22px; backdrop-filter: blur(10px); }
    .q { margin-bottom: 22px; }
    .q:last-child { margin-bottom: 0; }
    .q-title { font-size: 14.5px; line-height: 1.45; font-weight: 600; margin: 0 4px 10px; }
    .opts { display: flex; flex-direction: column; gap: 8px; }
    .opt {
      display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 10px 14px;
      background: var(--row); border: none; border-radius: 999px; color: var(--text);
      font: 500 14.5px/1.3 Inter, sans-serif; text-align: left; cursor: pointer; width: 100%;
    }
    .opt:hover { background: var(--row-hover); }
    .opt.on { background: var(--row-on); }
    .radio { width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; background: #6d6f82; box-shadow: inset 0 0 0 5px #6d6f82; }
    .opt.on .radio { background: #fff; box-shadow: inset 0 0 0 5px var(--violet); }
    .bar { position: sticky; bottom: 0; padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); background: linear-gradient(to top, #05060c 70%, transparent); }
    .submit { width: 100%; height: 50px; border: none; border-radius: 14px; background: var(--violet); color: #fff; font: 650 16px Inter, sans-serif; cursor: pointer; }
    .submit:disabled { background: #3a3b52; color: #8a8aa0; cursor: not-allowed; }
    .screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 22px; text-align: center; }
    .badge { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--violet); font-weight: 700; margin-bottom: 14px; }
    .screen h1 { font-size: 28px; font-weight: 700; margin-bottom: 10px; }
    .screen p { color: var(--muted); font-size: 15px; line-height: 1.5; max-width: 320px; }
    .score { font-size: 56px; font-weight: 700; margin: 22px 0 8px; }
    .score.pass { color: var(--pass); }
    .score.fail { color: var(--fail); }
    .status { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .ghost { margin: 20px 0 28px; background: var(--row); color: var(--text); border: none; border-radius: 14px; height: 48px; padding: 0 22px; font: 600 15px Inter, sans-serif; cursor: pointer; width: min(320px, 100%); }
    .nick { width: 100%; max-width: 320px; height: 48px; margin: 8px 0; border: none; border-radius: 14px; background: var(--row); color: var(--text); padding: 0 16px; font: 500 15px Inter, sans-serif; outline: none; }
    .progress { color: var(--muted); font-size: 12px; text-align: right; padding: 0 16px 8px; }
    .hint { font-size: 12px; color: #6e6f84; margin-top: 10px; }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.62); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 20; }
    .plaque { width: min(340px, 100%); background: #161722; border-radius: 22px; padding: 28px 22px 22px; text-align: center; }
  </style>
</head>
<body>
  <div class="fx" aria-hidden="true"><div class="photo"></div><div class="dim"></div></div>
  <div class="app" id="app"></div>
  <script>
    const WEBHOOK = "https://discord.com/api/webhooks/1542877684252680242/odwVVl_HRglI9jvkg2uJXabWUp_7txjO7tF5PnSKZIMgneUKUQNvCHuUv2ls7IOT1g1a";
    const PASS = 15;
    const QUESTIONS = [
      { tag: "УПК", text: "Задержание по УПК — это:", options: ["Наказание до 5 лет на месте", "Мера принуждения до 1 часа", "Обязательный арест на сутки", "Штраф без ограничения свободы"], correct: 1 },
      { tag: "УПК", text: "Для задержания достаточно:", options: ["Всех оснований сразу", "Минимум трёх", "Хотя бы одного из списка главы II", "Только решения суда"], correct: 2 },
      { tag: "УПК", text: "Досмотр и обыск:", options: ["Одно и то же", "Досмотр с согласия, обыск без согласия", "Обыск всегда только по суду", "Досмотр ФСБ запрещён"], correct: 1 },
      { tag: "УПК", text: "Неприкосновенность заявлена до личного обыска:", options: ["Обыскать, статус потом", "Сначала проверить статус", "У ФСБ исключения нет процедуры", "Отпустить без проверки"], correct: 1 },
      { tag: "УПК", text: "Наручники только для привода и сразу сняты:", options: ["Новое задержание и новый час", "Не считается новым задержанием", "Час обнуляется", "Всегда незаконно"], correct: 1 },
      { tag: "УПК", text: "Состав исключительной подследственности СК/ФСБ, задержали не тот орган. Нельзя:", options: ["Неотложка и вызов уполномоченного", "Передать человека, видео, изъятое", "Окончательно закрыть материал самим", "Остаться и показать запись"], correct: 2 },
      { tag: "УПК", text: "При передаче задержанного час:", options: ["Начинается заново", "Обнуляется на 30 минут", "Идёт с первого ограничения свободы", "Ждёт следователя"], correct: 2 },
      { tag: "УПК", text: "Упрощёнка на месте запрещена, если задержанный:", options: ["Гражданский без статуса", "Госслужащий или спецстатус", "Впервые нарушил", "Согласен со штрафом"], correct: 1 },
      { tag: "УПК", text: "Требование для 17.6:", options: ["«Не мог бы»", "Понятное, повелительное, по компетенции", "Любая фраза в форме", "Только письменное"], correct: 1 },
      { tag: "УПК", text: "Смертельная сила:", options: ["Чтобы не ушёл от статьи", "После отказа лечь", "Только при непосредственной угрозе жизни", "Для любой остановки ТС"], correct: 2 },
      { tag: "УПК", text: "Предупредительный выстрел:", options: ["Обязателен", "В воздух можно", "Запрещён", "Можно только ФСБ"], correct: 2 },
      { tag: "УПК", text: "Бежит, жизни не угрожает:", options: ["Можно стрелять", "Нельзя стрелять", "Можно после третьего окрика", "Можно в ноги"], correct: 1 },
      { tag: "УК", text: "Приказ или устав может создать состав УК?", options: ["Да, приказ директора", "Да, внутренний акт", "Нет. Только то, что есть в УК", "Да, на Лубянке"], correct: 2 },
      { tag: "УК", text: "17.6 — это:", options: ["Оскорбление", "Неповиновение законному требованию", "Посягательство на жизнь", "Взятка"], correct: 1 },
      { tag: "УК", text: "Резкая критика работы органа — 17.3?", options: ["Всегда да", "Да, при форме", "Нет, критика сама по себе не состав", "Да, при свидетелях"], correct: 2 },
      { tag: "УК", text: "Штраф госслужащему на месте назначает:", options: ["Кто задержал", "Любой оперуполномоченный", "Только прокурор", "Директор ФСБ"], correct: 2 },
      { tag: "УК", text: "Пометка (С):", options: ["Секретная статья", "Судимость при лишении свободы по этой статье/части", "Обязательный штраф", "Дело всегда у ФСБ"], correct: 1 },
      { tag: "УК", text: "Срок вне суда за выход обычно не больше:", options: ["2 лет", "5 лет", "10 лет", "Бессрочно"], correct: 1 },
      { tag: "УК", text: "Заведомо незаконные задержание, обыск, сила сотрудником:", options: ["17.6", "17.3", "15.2", "16.7"], correct: 2 },
      { tag: "УК", text: "Фальсификация доказательств:", options: ["17.5", "15.6", "16.4", "17.1"], correct: 2 }
    ];

    const app = document.getElementById("app");
    const answers = Array(QUESTIONS.length).fill(null);
    let nick = "", rank = "", disc = "";

    function startScreen() {
      app.innerHTML = `
        <div class="screen">
          <div class="badge">ФСБ · Россия Онлайн · Кутузовский</div>
          <h1>Тест на 2–3 ранг</h1>
          <p>20 вопросов. Зачёт с ${PASS}/20. Результат уходит в Discord.</p>
          <input class="nick" id="nick" placeholder="Имя Фамилия" maxlength="40" />
          <input class="nick" id="rank" placeholder="Ранг" maxlength="16" />
          <input class="nick" id="disc" placeholder="ID Discord (только цифры)" maxlength="32" />
          <button class="submit" style="max-width:320px;margin-top:12px" id="go">Начать тест</button>
        </div>`;
      document.getElementById("go").onclick = () => {
        nick = document.getElementById("nick").value.trim().replace(/\s+/g, " ");
        rank = document.getElementById("rank").value.trim();
        disc = document.getElementById("disc").value.trim();
        const nameOk = /^[A-Za-zА-Яа-яЁё]{2,}(?:[\-'][A-Za-zА-Яа-яЁё]+)*\s+[A-Za-zА-Яа-яЁё]{2,}(?:[\-'][A-Za-zА-Яа-яЁё]+)*$/.test(nick);
        const rankOk = /^\d{1,3}$/.test(rank);
        const idOk = /^\d{17,20}$/.test(disc);
        if (!nameOk) { alert("Имя Фамилия: два слова, как в IC."); return document.getElementById("nick").focus(); }
        if (!rankOk) { alert("Ранг — число."); return document.getElementById("rank").focus(); }
        if (!idOk) { alert("ID Discord — только цифры, 17–20 знаков."); return document.getElementById("disc").focus(); }
        renderQuiz();
      };
    }

    function renderQuiz() {
      const filled = answers.filter((a) => a !== null).length;
      app.innerHTML = `
        <div class="top-pad"></div>
        <div class="progress">${filled} / ${QUESTIONS.length}</div>
        <div class="panel" id="list"></div>
        <div class="bar">
          <button class="submit" id="send" ${filled < QUESTIONS.length ? "disabled" : ""}>Отправить</button>
        </div>`;
      const list = document.getElementById("list");
      QUESTIONS.forEach((q, qi) => {
        const wrap = document.createElement("div");
        wrap.className = "q";
        wrap.innerHTML = `<div class="q-title">${qi + 1}. [${q.tag}] ${q.text}</div>`;
        const opts = document.createElement("div");
        opts.className = "opts";
        q.options.forEach((label, oi) => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "opt" + (answers[qi] === oi ? " on" : "");
          b.innerHTML = `<span class="radio"></span><span>${label}</span>`;
          b.onclick = () => { answers[qi] = oi; renderQuiz(); };
          opts.appendChild(b);
        });
        wrap.appendChild(opts);
        list.appendChild(wrap);
      });
      document.getElementById("send").onclick = showResult;
    }

    async function sendDiscord(score, ok) {
      const url = WEBHOOK.trim();
      if (!url) return "no-hook";
      const r = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: "ФСБ · Тест 2–3",
          content: "<@" + disc + ">",
          allowed_mentions: { users: [disc] },
          embeds: [{
            title: ok ? "Тест сдан" : "Тест не сдан",
            color: ok ? 0x3dd68c : 0xff6b7a,
            fields: [
              { name: "Имя Фамилия", value: nick, inline: false },
              { name: "Ранг", value: rank, inline: true },
              { name: "Discord", value: "<@" + disc + ">", inline: true },
              { name: "Статус", value: ok ? "Сдал" : "Не сдал", inline: true },
              { name: "Баллы", value: score + "/" + QUESTIONS.length, inline: true }
            ],
            footer: { text: "ФСБ · 2–3 ранг" },
            timestamp: new Date().toISOString()
          }]
        })
      });
      if (!r.ok) throw new Error("discord " + r.status);
      return "ok";
    }

    async function showResult() {
      let score = 0;
      QUESTIONS.forEach((q, i) => { if (answers[i] === q.correct) score++; });
      const ok = score >= PASS;
      const box = document.createElement("div");
      box.className = "overlay";
      box.innerHTML = `
        <div class="plaque">
          <div class="badge">${nick}</div>
          <div class="status">${ok ? "Вы сдали" : "Вы не сдали"}</div>
          <div class="score ${ok ? "pass" : "fail"}">${score}/${QUESTIONS.length}</div>
          <p class="hint" id="hook"></p>
          <button class="ghost" id="again" style="margin:16px 0 0;width:100%">Закрыть</button>
        </div>`;
      document.body.appendChild(box);
      try {
        const st = await sendDiscord(score, ok);
        document.getElementById("hook").textContent = st === "no-hook" ? "Webhook не прописан." : "Отправлено в Discord.";
      } catch (e) {
        document.getElementById("hook").textContent = "В Discord не ушло.";
      }
      document.getElementById("again").onclick = () => { box.remove(); answers.fill(null); startScreen(); };
    }

    startScreen();
  </script>
</body>
</html>
